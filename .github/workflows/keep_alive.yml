name: Keep Streamlit App Alive

on:
  schedule:
    # Corre cada 10 horas (ajustable). Formato cron: minuto hora dia mes dia_semana
    - cron: '0 */10 * * *'
  workflow_dispatch:
    # Permite correrlo manualmente desde la pestaña "Actions" en GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit app
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://mlb-rookies-analysis-jjkgcvcfxgqta6m94pfrj6.streamlit.app/ || true
